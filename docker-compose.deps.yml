# PostgreSQL + Redis only — for native `yarn dev` (service + web on the host).
#
#   docker compose -f docker-compose.deps.yml up -d
#
# Point apps/service/.env at localhost (see README). First run: yarn db:migrate

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: smarthome_k7
      POSTGRES_USER: smarthome_k7
      POSTGRES_PASSWORD: smarthome_k7
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smarthome_k7 -d smarthome_k7']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres-data:
