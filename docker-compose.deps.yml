# MariaDB + Redis only — for native `yarn dev` (service + web on the host).
#
#   docker compose -f docker-compose.deps.yml up -d
#
# Point apps/service/.env at localhost (see README). First run: yarn db:migrate

services:
  mariadb:
    image: mariadb:11
    ports:
      - '3306:3306'
    environment:
      MARIADB_DATABASE: apollo
      MARIADB_USER: apollo
      MARIADB_PASSWORD: apollo
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mariadb-data:
