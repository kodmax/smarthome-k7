services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarthome_k7
      POSTGRES_USER: smarthome_k7
      POSTGRES_PASSWORD: smarthome_k7
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smarthome_k7 -d smarthome_k7']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine

  service:
    build:
      context: .
      dockerfile: apps/service/Dockerfile
    env_file:
      - apps/service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - service-cache:/app/apps/service/.cache
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '80:80'
    depends_on:
      - service
    restart: unless-stopped

volumes:
  postgres-data:
  service-cache:
